events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Upstream для frontend
    upstream frontend {
        server frontend:80;
    }

    # Upstream для mediamtx
    upstream mediamtx_rtmp {
        server mediamtx:1935;
    }

    upstream mediamtx_api {
        server mediamtx:8888;
    }

    server {
        listen 80;
        server_name _;

        # Проксування на frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксування на mediamtx API
        location /mediamtx/ {
            proxy_pass http://mediamtx_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket підтримка для HLS/DASH streaming
        location /stream/ {
            proxy_pass http://mediamtx_api/live/;

            proxy_http_version 1.1;
            proxy_set_header Host mediamtx:8888;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /live/ {
            proxy_pass http://mediamtx_api/live/;

            proxy_http_version 1.1;
            proxy_set_header Host mediamtx:8888;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # RTMP streaming (TCP stream)
    # Примітка: RTMP працює на TCP, тому потрібен stream блок
}

# Stream блок для RTMP
stream {
    upstream rtmp_backend {
        server mediamtx:1935;
    }

    server {
        listen 1935;
        proxy_pass rtmp_backend;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
    }
}
